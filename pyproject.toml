[project]
name = "movie-translator"
version = "0.1.0"
description = "Traduce y subtitula (y a futuro dobla) peliculas y videos mediante IA."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Fase 1: transcripcion
transcription = [
    "faster-whisper>=1.0",
]
# Fase 1: subtitulos (parsing/formato SRT)
subtitles = [
    "srt>=3.5",
]
# Fase 1: proveedores de traduccion (instalar solo el que se vaya a usar)
translation-anthropic = ["anthropic>=0.34"]
translation-openai = ["openai>=1.40"]
translation-ollama = ["httpx>=0.27"]
# Fase 2: diarizacion de hablantes
diarization = [
    "pyannote.audio>=3.3",
]
# Fase 3: sintesis de voz (se definira el paquete concreto al llegar a esta fase)
tts = []
# Fase 4: separacion de audio
separation = [
    "demucs>=4.0",
]
# Fase 6: API
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# Desarrollo
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
movie-translator = "apps.cli.main:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_translator", "apps"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
