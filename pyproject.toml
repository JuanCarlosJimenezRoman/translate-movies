[project]
name = "movie-translator"
version = "0.1.0"
description = "Traduce y subtitula (y a futuro dobla) peliculas y videos mediante IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # Transcripcion y subtitulos son parte del uso normal del CLI desde la
    # Fase 1 (no features futuras): van en dependencies, no en un extra que
    # haya que acordarse de pedir. "uv sync" a secas ya deja el CLI usable.
    "faster-whisper>=1.0",
    # El wheel de av 18.x para linux_x86_64/cp311 viene incompleto (falta
    # av/video/frame.abi3.so), lo que rompe "import faster_whisper". 13.1.0 es
    # la ultima version confirmada con el .so completo en este entorno.
    "av==13.1.0",
    # av (via su modulo compilado) importa 'cython' en tiempo de ejecucion sin
    # declararlo como dependencia propia. Sin esto, el import falla igual.
    "cython>=3.0",
    # Fase 1: subtitulos (parsing/formato SRT)
    "srt>=3.5",
]

[project.optional-dependencies]
# Fase 1: proveedores de traduccion (instalar solo el que se vaya a usar)
translation-anthropic = ["anthropic>=0.34"]
translation-openai = ["openai>=1.40"]
translation-ollama = ["httpx>=0.27"]
# Fase 2: diarizacion de hablantes
diarization = [
    "pyannote.audio>=3.3",
]
# Fase 3: sintesis de voz (se definira el paquete concreto al llegar a esta fase)
tts = []
# Fase 4: separacion de audio
separation = [
    "demucs>=4.0",
]
# Fase 6: API
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
# Desarrollo
# anthropic/openai/httpx estan aqui (ademas de en sus extras translation-*)
# porque tests/test_translation_providers.py importa esos modulos de forma
# incondicional al recolectar los tests (aunque las llamadas de red estan
# mockeadas). Son SDKs livianos, no como pyannote/demucs -- por eso no pasa
# nada por tenerlos siempre en dev. "uv sync --extra dev" debe alcanzar para
# correr la suite completa sin tener que acordarse de pedir cada extra.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.scripts]
movie-translator = "apps.cli.main:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_translator", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# EXE002: el mount de este proyecto no tiene permisos unix reales (todos los
# archivos aparecen ejecutables), asi que esta regla da puro falso positivo.
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
# B008: typer/fastapi usan "= typer.Option(...)" / "= Depends(...)" en los
# defaults a proposito; no es el antipatron que la regla busca detectar.
"apps/cli/*.py" = ["B008"]
"apps/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
[[tool.mypy.overrides]]
# faster-whisper no publica type stubs ni marca py.typed. anthropic/openai
# si son bien tipados, pero son extras opcionales -- no siempre estan
# instalados en el entorno donde corre mypy, y no queremos que eso rompa el
# chequeo del resto del proyecto.
module = ["faster_whisper.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true
# "skip": ni siquiera abre/parsea el codigo fuente de estos paquetes (los
# trata como Any). anthropic/openai son SDKs grandes y bien tipados, pero
# analizarlos de verdad es lento y no aporta nada aqui -- solo los usamos
# por su API publica, ya cubierta por nuestro propio codigo con mypy normal.
follow_imports = "skip"
